<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062a2e"/>
      <stop offset="100%" stop-color="#0c4750"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1fa6a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#128089" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="400" fill="url(#glow)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1fa6a0" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="280" font-family="Poppins, sans-serif" font-size="72" font-weight="700" 
        fill="#ffffff" text-anchor="middle">Masalah Sosial</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="Poppins, sans-serif" font-size="28" font-weight="400" 
        fill="rgba(255,255,255,0.8)" text-anchor="middle">Presentasi Kelompok 2</text>
  
  <!-- Names -->
  <text x="600" y="420" font-family="Poppins, sans-serif" font-size="22" font-weight="600" 
        fill="#1fa6a0" text-anchor="middle">Aril · Fandi · Andre · Sandi · Yuda · Agri</text>
  
  <!-- Accent line -->
  <rect x="400" y="470" width="400" height="4" rx="2" fill="url(#g)"/>
  
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#128089"/>
      <stop offset="100%" stop-color="#1fa6a0"/>
    </linearGradient>
  </defs>
</svg>